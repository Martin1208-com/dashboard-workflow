<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workflow-Zentrale – Unternehmensübersicht</title>
<style>
  :root {
    --bg: #0f1420;
    --panel: #171e2e;
    --panel-2: #1e2740;
    --border: #2a3654;
    --text: #e8edf7;
    --muted: #8b97b0;
    --accent: #4f8cff;
    --green: #2ecc71;
    --amber: #f5a623;
    --red: #e74c3c;
    --purple: #9b59b6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    padding: 18px 28px;
    background: linear-gradient(180deg, #1a2338, #141b2c);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo {
    width: 40px; height: 40px; border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--purple));
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }
  .brand h1 { font-size: 18px; font-weight: 600; }
  .brand small { color: var(--muted); font-size: 12px; display: block; }
  .header-right { display: flex; align-items: center; gap: 14px; }
  .clock { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .live-toggle {
    display: flex; align-items: center; gap: 8px;
    background: var(--panel-2); border: 1px solid var(--border);
    padding: 7px 14px; border-radius: 20px; cursor: pointer;
    font-size: 13px; user-select: none;
  }
  .live-dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--green);
    animation: pulse 1.6s infinite;
  }
  .live-toggle.paused .live-dot { background: var(--muted); animation: none; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(46, 204, 113, .5); }
    70% { box-shadow: 0 0 0 7px rgba(46, 204, 113, 0); }
    100% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0); }
  }

  .kpis {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 14px;
    padding: 20px 28px 4px;
  }
  .kpi {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
  }
  .kpi .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  .kpi .value { font-size: 28px; font-weight: 700; margin-top: 4px; }
  .kpi .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .kpi.green .value { color: var(--green); }
  .kpi.amber .value { color: var(--amber); }
  .kpi.red .value { color: var(--red); }
  .kpi.blue .value { color: var(--accent); }

  .toolbar {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    padding: 16px 28px;
  }
  .toolbar input[type="search"] {
    background: var(--panel); border: 1px solid var(--border);
    color: var(--text); padding: 9px 14px; border-radius: 8px;
    font-size: 13px; width: 240px; outline: none;
  }
  .toolbar input[type="search"]:focus { border-color: var(--accent); }
  .chip {
    background: var(--panel); border: 1px solid var(--border);
    color: var(--muted); padding: 7px 14px; border-radius: 20px;
    font-size: 13px; cursor: pointer; transition: .15s;
  }
  .chip:hover { color: var(--text); }
  .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .layout {
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 18px;
    padding: 0 28px 30px;
    align-items: start;
  }
  @media (max-width: 980px) { .layout { grid-template-columns: 1fr; } }

  .side h2, .main h2 {
    font-size: 13px; text-transform: uppercase; letter-spacing: .07em;
    color: var(--muted); margin-bottom: 10px;
  }
  .dept-list { display: flex; flex-direction: column; gap: 8px; }
  .dept-card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 14px; cursor: pointer;
    transition: .15s; border-left: 4px solid var(--muted);
  }
  .dept-card:hover { background: var(--panel-2); }
  .dept-card.active { background: var(--panel-2); border-color: var(--accent); }
  .dept-head { display: flex; align-items: center; gap: 10px; }
  .dept-icon { font-size: 20px; }
  .dept-name { font-size: 14px; font-weight: 600; flex: 1; }
  .dept-count {
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 12px; font-size: 11px; padding: 2px 8px; color: var(--muted);
  }
  .dept-meta { margin-top: 8px; display: flex; align-items: center; gap: 8px; }
  .dept-bar { flex: 1; height: 6px; background: #0d1120; border-radius: 3px; overflow: hidden; }
  .dept-bar > div { height: 100%; background: var(--accent); border-radius: 3px; transition: width .5s; }
  .dept-meta span { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .section { margin-bottom: 26px; }
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
    gap: 14px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    cursor: pointer;
    transition: .15s;
  }
  .card:hover { transform: translateY(-2px); border-color: var(--accent); }
  .card-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .card-top .icon { font-size: 22px; }
  .card-title { font-size: 15px; font-weight: 600; flex: 1; }
  .card-sub { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
  .badge {
    font-size: 11px; padding: 3px 10px; border-radius: 12px;
    font-weight: 600; white-space: nowrap;
  }
  .badge.laeuft { background: rgba(46,204,113,.15); color: var(--green); }
  .badge.wartet { background: rgba(245,166,35,.15); color: var(--amber); }
  .badge.fehler { background: rgba(231,76,60,.18); color: var(--red); }
  .badge.fertig { background: rgba(79,140,255,.15); color: var(--accent); }
  .badge.paused { background: rgba(139,151,176,.15); color: var(--muted); }

  .progress {
    height: 8px; background: #0d1120; border-radius: 4px; overflow: hidden;
    margin-bottom: 10px;
  }
  .progress > div {
    height: 100%; border-radius: 4px;
    background: linear-gradient(90deg, var(--accent), #6fa8ff);
    transition: width .6s ease;
  }
  .progress > div.warn { background: linear-gradient(90deg, var(--amber), #ffc861); }
  .progress > div.err { background: linear-gradient(90deg, var(--red), #ff7b6e); }

  .card-foot {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 12px; color: var(--muted);
  }
  .avatars { display: flex; }
  .avatar {
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--panel-2); border: 2px solid var(--panel);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; margin-left: -7px;
  }
  .avatar:first-child { margin-left: 0; }
  .avatar.online { box-shadow: 0 0 0 2px rgba(46,204,113,.6); }
  .avatar.busy { box-shadow: 0 0 0 2px rgba(245,166,35,.6); }
  .avatar.off { opacity: .45; }

  .agent-row {
    display: flex; align-items: center; gap: 14px;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 16px; margin-bottom: 8px;
    transition: .15s;
  }
  .agent-row:hover { background: var(--panel-2); }
  .agent-emoji {
    width: 40px; height: 40px; border-radius: 10px; font-size: 20px;
    background: var(--panel-2); display: flex; align-items: center;
    justify-content: center; flex-shrink: 0;
  }
  .agent-info { flex: 1; min-width: 0; }
  .agent-name { font-size: 14px; font-weight: 600; }
  .agent-task { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .agent-load { width: 140px; flex-shrink: 0; }
  .agent-load .bar { height: 6px; background: #0d1120; border-radius: 3px; overflow: hidden; margin-bottom: 4px; }
  .agent-load .bar > div { height: 100%; border-radius: 3px; transition: width .6s; }
  .agent-load small { color: var(--muted); font-size: 11px; }
  @media (max-width: 640px) { .agent-load { display: none; } }

  .modal-bg {
    position: fixed; inset: 0; background: rgba(5, 8, 15, .7);
    display: none; align-items: center; justify-content: center; z-index: 50;
    padding: 20px;
  }
  .modal-bg.open { display: flex; }
  .modal {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; width: 100%; max-width: 620px;
    max-height: 85vh; overflow-y: auto; padding: 24px;
  }
  .modal h3 { font-size: 18px; margin-bottom: 4px; display: flex; align-items: center; gap: 10px; }
  .modal .m-sub { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
  .steps { margin: 14px 0; }
  .step {
    display: flex; gap: 12px; padding: 8px 0; font-size: 13px;
    border-bottom: 1px dashed var(--border); align-items: center;
  }
  .step:last-child { border-bottom: none; }
  .step .s-icon { width: 22px; text-align: center; flex-shrink: 0; }
  .step .s-name { flex: 1; }
  .step.done .s-name { color: var(--muted); text-decoration: line-through; }
  .step.active .s-name { color: var(--accent); font-weight: 600; }
  .log {
    background: #0d1120; border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 14px; font-family: "Cascadia Code", Consolas, monospace;
    font-size: 12px; color: var(--muted); max-height: 160px; overflow-y: auto;
    margin-top: 14px;
  }
  .log div { padding: 2px 0; }
  .log .t { color: var(--accent); }
  .close-btn {
    float: right; background: var(--panel-2); color: var(--muted);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 5px 12px; cursor: pointer; font-size: 13px;
  }
  .close-btn:hover { color: var(--text); }
  footer {
    text-align: center; color: var(--muted); font-size: 12px;
    padding: 10px 0 24px;
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="logo">⚙️</div>
    <div>
      <h1>Workflow-Zentrale</h1>
      <small>Live-Übersicht aller Prozesse &amp; Agents</small>
    </div>
  </div>
  <div class="header-right">
    <span class="clock" id="clock"></span>
    <div class="live-toggle" id="liveToggle" title="Live-Aktualisierung an/aus">
      <div class="live-dot"></div><span id="liveLabel">Live</span>
    </div>
  </div>
</header>

<div class="kpis" id="kpis"></div>

<div class="toolbar">
  <input type="search" id="search" placeholder="🔍 Workflows oder Agents suchen …">
  <span class="chip active" data-status="alle">Alle</span>
  <span class="chip" data-status="läuft">Läuft</span>
  <span class="chip" data-status="wartet">Wartet</span>
  <span class="chip" data-status="fehler">Fehler</span>
  <span class="chip" data-status="fertig">Fertig</span>
</div>

<div class="layout">
  <aside class="side">
    <h2>Abteilungen</h2>
    <div class="dept-list" id="deptList"></div>
  </aside>
  <main class="main">
    <div class="section">
      <h2 id="wfHeading">Aktive Workflows</h2>
      <div class="cards" id="workflowCards"></div>
    </div>
    <div class="section">
      <h2 id="agHeading">Agents im Einsatz</h2>
      <div id="agentList"></div>
    </div>
  </main>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal" id="modal"></div>
</div>

<footer>Demo-Dashboard mit simulierten Live-Daten · Prototyp</footer>

<script>
const DEPARTMENTS = [
  { id: "buchhaltung", name: "Buchhaltung", icon: "📊", color: "#4f8cff" },
  { id: "lohn", name: "Lohnverrechnung", icon: "💰", color: "#2ecc71" },
  { id: "av", name: "Arbeitsvorbereitung", icon: "📋", color: "#9b59b6" },
  { id: "waren", name: "Warenwirtschaft", icon: "📦", color: "#f5a623" },
  { id: "produktion", name: "Produktion", icon: "🏭", color: "#e74c3c" },
];

let uid = 0;
const W = (dept, icon, name, sub, status, progress, agents, steps) =>
  ({ id: ++uid, dept, icon, name, sub, status, progress, agents, steps });

const WORKFLOWS = [
  W("buchhaltung", "🧾", "Eingangsrechnungen verbuchen", "OCR + Freigabe-Workflow", "läuft", 62,
    ["Beleg-Bot", "Prüf-Agent"],
    ["Belege einlesen (OCR)", "Positionen prüfen", "Kostenstellen zuordnen", "Freigabe einholen", "In ERP buchen"]),
  W("buchhaltung", "🏦", "Bankabstimmung (Konto 1800)", "Täglicher Abgleich Bank ↔ ERP", "läuft", 84,
    ["Abgleich-Bot"],
    ["Kontoauszug abrufen", "Positionen matchen", "Offene Posten markieren", "Differenzreport erzeugen"]),
  W("buchhaltung", "📅", "Monatsabschluss Vorbereitung", "Abschluss-Checkliste Februar", "wartet", 30,
    ["Abschluss-Agent"],
    ["Abschreibungen laufen lassen", "Rückstellungen prüfen", "Umsatzsteuer-Vormeldung", "Freigabe durch Steuerberatung"]),
  W("lohn", "💵", "Lohnlauf Februar", "Gehälter + Stunden erfassen", "läuft", 71,
    ["Zeiten-Bot", "Lohn-Agent"],
    ["Zeiterfassung importieren", "Überstunden validieren", "Zulagen/Sonderzahlungen", "Lohnjournal erzeugen", "SEPA-Datei erstellen"]),
  W("lohn", "🏥", "Krankmeldungen verarbeiten", "AU-Meldungen an Krankenkasse", "läuft", 45,
    ["Melde-Bot"],
    ["Bescheinigungen einlesen", "Entgeltfortzahlung berechnen", "Meldung an Krankenkasse", "Ablage Personalakte"]),
  W("lohn", "📤", "Finanzamt-Meldungen", "Lohnsteuer + SV-Meldungen", "fehler", 55,
    ["Melde-Bot"],
    ["Daten sammeln", "Prüfregeln ausführen", "Übermittlung DEÜV", "Bestätigung archivieren"]),
  W("av", "📐", "Auftrag 2024-1187: CNC-Frästeile", "Arbeitspläne + Materialbedarf", "läuft", 38,
    ["Planungs-Agent", "Stücklisten-Bot"],
    ["Zeichnungen prüfen", "Arbeitsplan erstellen", "Materialbedarf ermitteln", "Maschinenbelegung planen", "Freigabe Produktion"]),
  W("av", "🛠️", "Rüstzeiten optimieren", "Analyse Woche 8", "wartet", 12,
    ["Analyse-Agent"],
    ["Rüstprotokolle sammeln", "Muster erkennen", "Vorschläge erzeugen"]),
  W("av", "📄", "Angebot 2024-0342 (Sonderanfertigung)", "Kalkulation + Vertriebsfreigabe", "läuft", 66,
    ["Kalkulations-Agent"],
    ["Stückliste aus CAD", "Lieferantenpreise abrufen", "Kalkulation erstellen", "Vertriebsfreigabe"]),
  W("waren", "📥", "Wareneingang Lieferant Metzger GmbH", "Lieferschein 88412", "läuft", 90,
    ["WE-Bot"],
    ["Lieferschein scannen", "Mengen prüfen", "Qualitätskontrolle", "ERP-Buchung"]),
  W("waren", "📦", "Inventurdifferenzen auflösen", "Lager 1 + 2, 23 Positionen", "fehler", 20,
    ["Inventur-Bot"],
    ["Differenzen ermitteln", "Ursachenanalyse", "Umbuchungen vorbereiten", "Freigabe Lagerleitung"]),
  W("waren", "🚚", "Bestellvorschläge generieren", "Dispo: Automatische Nachbestellung", "läuft", 58,
    ["Dispo-Agent"],
    ["Bestände & Bedarfe lesen", "Mindestmengen prüfen", "Bestellvorschläge erzeugen", "An Einkaufs-Workflow"]),
  W("produktion", "🏭", "Schichtplan A: Serienfertigung", "Linie 2 – Tagesschicht", "läuft", 77,
    ["Leitstand-Agent", "Qualitäts-Bot"],
    ["Material bereitstellen", "Maschinen aufrüsten", "Fertigung laufen", "Qualitätsprüfung", "Rückmeldung ERP"]),
  W("produktion", "⚠️", "Wartung Presse P-07", "Geplante Wartung Woche 9", "wartet", 5,
    ["Wartungs-Planer"],
    ["Ersatzteile reservieren", "Stillstand einplanen", "Wartungsauftrag erstellen"]),
  W("produktion", "🔁", "Rückruf: Charge 2024-0291", "Qualitätsproblem erkannt", "fehler", 40,
    ["Rückruf-Agent", "Qualitäts-Bot"],
    ["Betroffene Chargen identifizieren", "Kunden benachrichtigen", "Bestände sperren", "Ursachenanalyse"]),
  W("produktion", "✅", "Endkontrolle Auftrag 2024-1179", "Stichprobenprüfung", "fertig", 100,
    ["Qualitäts-Bot"],
    ["Prüfplan laden", "Messwerte erfassen", "Prüfbericht erstellen", "Freigabe Versand"]),
];

const AGENTS = [
  { name: "Beleg-Bot", dept: "buchhaltung", icon: "🧾", status: "online", load: 72, task: "Verarbeitet Rechnung RE-2024-8841 (OCR)" },
  { name: "Prüf-Agent", dept: "buchhaltung", icon: "🔍", status: "online", load: 58, task: "Prüft Kostenstellen-Zuordnung" },
  { name: "Abschluss-Agent", dept: "buchhaltung", icon: "📅", status: "online", load: 31, task: "Wartet auf Freigabe Monatsabschluss" },
  { name: "Abgleich-Bot", dept: "buchhaltung", icon: "🏦", status: "online", load: 44, task: "Bankpositionen abgleichen" },
  { name: "Zeiten-Bot", dept: "lohn", icon: "⏱️", status: "online", load: 66, task: "Import Zeiterfassung KW 8" },
  { name: "Lohn-Agent", dept: "lohn", icon: "💰", status: "online", load: 81, task: "Lohnjournal Februar erzeugen" },
  { name: "Melde-Bot", dept: "lohn", icon: "📤", status: "error", load: 92, task: "FEHLER: DEÜV-Übermittlung abgelehnt" },
  { name: "Planungs-Agent", dept: "av", icon: "📐", status: "online", load: 77, task: "Arbeitsplan Auftrag 2024-1187" },
  { name: "Stücklisten-Bot", dept: "av", icon: "🧮", status: "online", load: 49, task: "Stückliste aus CAD extrahieren" },
  { name: "Kalkulations-Agent", dept: "av", icon: "🧾", status: "online", load: 63, task: "Angebot 2024-0342 kalkulieren" },
  { name: "Analyse-Agent", dept: "av", icon: "📊", status: "idle", load: 12, task: "Wartet auf Rüstprotokolle" },
  { name: "WE-Bot", dept: "waren", icon: "📥", status: "online", load: 39, task: "Wareneingang Lieferschein 88412" },
  { name: "Inventur-Bot", dept: "waren", icon: "📦", status: "error", load: 88, task: "FEHLER: Bestandsdaten unvollständig" },
  { name: "Dispo-Agent", dept: "waren", icon: "🚚", status: "online", load: 55, task: "Bestellvorschläge generieren" },
  { name: "Leitstand-Agent", dept: "produktion", icon: "🏭", status: "online", load: 84, task: "Schichtplan A steuern" },
  { name: "Qualitäts-Bot", dept: "produktion", icon: "🔬", status: "online", load: 61, task: "Stichproben Auftrag 2024-1179" },
  { name: "Rückruf-Agent", dept: "produktion", icon: "🔁", status: "online", load: 70, task: "Charge 2024-0291 sperren" },
  { name: "Wartungs-Planer", dept: "produktion", icon: "🛠️", status: "idle", load: 8, task: "Wartung Presse P-07 vorbereiten" },
];

const STATUS_LABEL = { läuft: "Läuft", wartet: "Wartet", fehler: "Fehler", fertig: "Fertig" };
const AGENT_LABEL = { online: "Aktiv", idle: "Inaktiv", error: "Fehler" };

let activeDept = "alle";
let activeStatus = "alle";
let searchTerm = "";
let live = true;

const deptList = document.getElementById("deptList");
const workflowCards = document.getElementById("workflowCards");
const agentList = document.getElementById("agentList");
const kpis = document.getElementById("kpis");

function deptById(id) { return DEPARTMENTS.find(d => d.id === id); }

function renderKpis() {
  const running = WORKFLOWS.filter(w => w.status === "läuft").length;
  const waiting = WORKFLOWS.filter(w => w.status === "wartet").length;
  const errors = WORKFLOWS.filter(w => w.status === "fehler").length;
  const done = WORKFLOWS.filter(w => w.status === "fertig").length;
  const activeAgents = AGENTS.filter(a => a.status === "online").length;
  kpis.innerHTML = `
    <div class="kpi blue"><div class="label">Aktive Workflows</div><div class="value">${running}</div><div class="sub">von ${WORKFLOWS.length} insgesamt</div></div>
    <div class="kpi green"><div class="label">Agents aktiv</div><div class="value">${activeAgents}</div><div class="sub">von ${AGENTS.length} Agents online</div></div>
    <div class="kpi amber"><div class="label">Wartend</div><div class="value">${waiting}</div><div class="sub">Freigaben / Material</div></div>
    <div class="kpi red"><div class="label">Fehler</div><div class="value">${errors}</div><div class="sub">benötigen Eingriff</div></div>
    <div class="kpi green"><div class="label">Abgeschlossen</div><div class="value">${done}</div><div class="sub">heute erfolgreich</div></div>`;
}

function renderDepts() {
  const card = (id, icon, name) => {
    const wfs = WORKFLOWS.filter(w => w.dept === id);
    const avg = wfs.length ? Math.round(wfs.reduce((s, w) => s + w.progress, 0) / wfs.length) : 0;
    const d = deptById(id);
    const active = activeDept === id ? " active" : "";
    return `<div class="dept-card${active}" data-dept="${id}">
      <div class="dept-head">
        <span class="dept-icon">${icon}</span>
        <span class="dept-name">${name}</span>
        <span class="dept-count">${wfs.length}</span>
      </div>
      <div class="dept-meta">
        <div class="dept-bar"><div style="width:${avg}%; background:${d.color}"></div></div>
        <span>${avg}%</span>
      </div>
    </div>`;
  };
  deptList.innerHTML =
    `<div class="dept-card${activeDept === "alle" ? " active" : ""}" data-dept="alle">
       <div class="dept-head"><span class="dept-icon">🏢</span>
       <span class="dept-name">Alle Bereiche</span>
       <span class="dept-count">${WORKFLOWS.length}</span></div></div>`
    + DEPARTMENTS.map(d => card(d.id, d.icon, d.name)).join("");
}

function matchesFilters(w) {
  const deptOk = activeDept === "alle" || w.dept === activeDept;
  const statusOk = activeStatus === "alle" || w.status === activeStatus;
  const term = searchTerm.toLowerCase();
  const searchOk = !term || (w.name + " " + w.sub + " " + w.agents.join(" ")).toLowerCase().includes(term);
  return deptOk && statusOk && searchOk;
}

function agentMatches(a) {
  const deptOk = activeDept === "alle" || a.dept === activeDept;
  const term = searchTerm.toLowerCase();
  const searchOk = !term || (a.name + " " + a.task).toLowerCase().includes(term);
  return deptOk && searchOk;
}

function barClass(status) {
  if (status === "fehler") return "err";
  if (status === "wartet") return "warn";
  return "";
}

function renderWorkflows() {
  const list = WORKFLOWS.filter(matchesFilters);
  const heading = document.getElementById("wfHeading");
  heading.textContent = `Aktive Workflows (${list.length})`;
  if (!list.length) {
    workflowCards.innerHTML = `<div style="color:var(--muted);font-size:14px;padding:20px 0">Keine Workflows für die aktuelle Auswahl.</div>`;
    return;
  }
  workflowCards.innerHTML = list.map(w => {
    const d = deptById(w.dept);
    return `<div class="card" data-wf="${w.id}">
      <div class="card-top">
        <span class="icon">${w.icon}</span>
        <span class="card-title">${w.name}</span>
        <span class="badge ${w.status}">${STATUS_LABEL[w.status]}</span>
      </div>
      <div class="card-sub">${d.icon} ${d.name} · ${w.sub}</div>
      <div class="progress"><div class="${barClass(w.status)}" style="width:${w.progress}%"></div></div>
      <div class="card-foot">
        <div class="avatars">${w.agents.map(n => {
          const a = AGENTS.find(x => x.name === n);
          const cls = a ? (a.status === "online" ? "online" : a.status === "error" ? "busy" : "off") : "";
          return `<div class="avatar ${cls}" title="${n}">${a ? a.icon : "🤖"}</div>`;
        }).join("")}</div>
        <span>${w.progress} % · ${w.agents.length} Agent(s)</span>
      </div>
    </div>`;
  }).join("");
}

function renderAgents() {
  const list = AGENTS.filter(agentMatches);
  const heading = document.getElementById("agHeading");
  heading.textContent = `Agents im Einsatz (${list.length})`;
  if (!list.length) {
    agentList.innerHTML = `<div style="color:var(--muted);font-size:14px;padding:12px 0">Keine Agents für die aktuelle Auswahl.</div>`;
    return;
  }
  agentList.innerHTML = list.map(a => {
    const d = deptById(a.dept);
    const loadColor = a.status === "error" ? "var(--red)" : a.load > 80 ? "var(--amber)" : "var(--green)";
    const badge = a.status === "online" ? "läuft" : a.status === "error" ? "fehler" : "paused";
    return `<div class="agent-row">
      <div class="agent-emoji">${a.icon}</div>
      <div class="agent-info">
        <div class="agent-name">${a.name} <span class="badge ${badge}">${AGENT_LABEL[a.status]}</span></div>
        <div class="agent-task">${d.icon} ${d.name} · ${a.task}</div>
      </div>
      <div class="agent-load">
        <div class="bar"><div style="width:${a.load}%; background:${loadColor}"></div></div>
        <small>Auslastung ${a.load} %</small>
      </div>
    </div>`;
  }).join("");
}

function renderAll() { renderKpis(); renderDepts(); renderWorkflows(); renderAgents(); }

/* ---------- Simulation ---------- */
const LOG_TEMPLATES = [
  "Beleg {n} erfolgreich verarbeitet",
  "Freigabe durch Supervisor erhalten",
  "Position {n} mit Kostenstelle 4310 verknüpft",
  "Preisänderung erkannt – Neukalkulation gestartet",
  "Bestandsaktualisierung abgeschlossen",
  "Nachricht an ERP-Interface gesendet",
  "Prüfregel R-{n} bestanden",
  "Warte auf Eingabe von Abteilung",
];

function tick() {
  WORKFLOWS.forEach(w => {
    if (w.status === "läuft") {
      w.progress = Math.min(100, w.progress + Math.floor(Math.random() * 3));
      if (w.progress >= 100) w.status = "fertig";
    } else if (w.status === "wartet" && Math.random() < 0.12) {
      w.status = "läuft";
    } else if (w.status === "fehler" && Math.random() < 0.05) {
      w.status = "wartet";
    } else if (w.status === "fertig" && Math.random() < 0.04) {
      w.progress = 0; w.status = "läuft";
    }
  });
  AGENTS.forEach(a => {
    if (a.status === "error" && Math.random() < 0.08) { a.status = "online"; a.task = a.task.replace("FEHLER: ", "Wiederholung: "); }
    if (a.status === "online") {
      a.load = Math.max(10, Math.min(98, a.load + (Math.random() * 10 - 5)));
      if (Math.random() < 0.05) { a.status = "idle"; a.task = "Wartet auf neuen Auftrag"; }
    } else if (a.status === "idle" && Math.random() < 0.25) {
      a.status = "online";
      a.task = LOG_TEMPLATES[Math.floor(Math.random() * LOG_TEMPLATES.length)].replace("{n}", Math.floor(Math.random() * 90 + 10));
    }
  });
  renderAll();
}

/* ---------- Detail modal ---------- */
const modalBg = document.getElementById("modalBg");
const modal = document.getElementById("modal");

function openWorkflowModal(w) {
  const d = deptById(w.dept);
  const stepState = (i) => {
    const doneCount = Math.round(w.progress / 100 * w.steps.length);
    if (i < doneCount) return "done";
    if (i === doneCount && w.status !== "fertig") return "active";
    return "";
  };
  const icon = { done: "✅", active: "⏳", "": "⬜" };
  modal.innerHTML = `
    <button class="close-btn" onclick="closeModal()">Schließen ✕</button>
    <h3>${w.icon} ${w.name}</h3>
    <div class="m-sub">${d.icon} ${d.name} · ${w.sub} · Status: ${STATUS_LABEL[w.status]} · ${w.progress} %</div>
    <div class="progress"><div class="${barClass(w.status)}" style="width:${w.progress}%"></div></div>
    <div class="steps">${w.steps.map((s, i) =>
      `<div class="step ${stepState(i)}"><span class="s-icon">${icon[stepState(i)]}</span><span class="s-name">${s}</span></div>`
    ).join("")}</div>
    <h3 style="font-size:14px">Zugewiesene Agents</h3>
    <div class="m-sub">${w.agents.join(" · ")}</div>
    <div class="log" id="wfLog"></div>`;
  modalBg.classList.add("open");
  const log = document.getElementById("wfLog");
  const push = () => {
    const t = new Date().toLocaleTimeString("de-DE");
    const line = LOG_TEMPLATES[Math.floor(Math.random() * LOG_TEMPLATES.length)].replace("{n}", Math.floor(Math.random() * 90 + 10));
    const div = document.createElement("div");
    div.innerHTML = `<span class="t">[${t}]</span> ${w.agents[0]}: ${line}`;
    log.prepend(div);
    while (log.children.length > 30) log.lastChild.remove();
  };
  push(); push(); push();
  w._logTimer = setInterval(push, 2500);
}

function closeModal() {
  modalBg.classList.remove("open");
  if (WORKFLOWS[0]._logTimer) WORKFLOWS.forEach(w => clearInterval(w._logTimer));
}
window.closeModal = closeModal;
modalBg.addEventListener("click", e => { if (e.target === modalBg) closeModal(); });

/* ---------- Events ---------- */
deptList.addEventListener("click", e => {
  const card = e.target.closest(".dept-card");
  if (!card) return;
  activeDept = card.dataset.dept;
  renderAll();
});
document.querySelectorAll(".chip").forEach(chip => {
  chip.addEventListener("click", () => {
    document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
    chip.classList.add("active");
    activeStatus = chip.dataset.status;
    renderWorkflows();
  });
});
document.getElementById("search").addEventListener("input", e => {
  searchTerm = e.target.value.trim();
  renderAll();
});
workflowCards.addEventListener("click", e => {
  const card = e.target.closest(".card");
  if (!card) return;
  const w = WORKFLOWS.find(x => x.id === Number(card.dataset.wf));
  if (w) openWorkflowModal(w);
});
const liveToggle = document.getElementById("liveToggle");
liveToggle.addEventListener("click", () => {
  live = !live;
  liveToggle.classList.toggle("paused", !live);
  document.getElementById("liveLabel").textContent = live ? "Live" : "Pausiert";
});

setInterval(() => {
  document.getElementById("clock").textContent =
    new Date().toLocaleString("de-DE", { weekday: "short", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit" });
}, 1000);
setInterval(() => { if (live) tick(); }, 3000);

renderAll();
</script>
</body>
