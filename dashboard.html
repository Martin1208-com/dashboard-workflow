<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Betriebszentrale – Workflow-Übersicht</title>
<style>
  :root {
    --bg: #fbfbfa;
    --surface: #ffffff;
    --border: #e7e5e0;
    --border-strong: #d6d3cc;
    --text: #1a1a18;
    --muted: #6f6d66;
    --faint: #a5a29a;
    --run: #15803d;
    --wait: #a16207;
    --err: #b91c1c;
    --done: #57534e;
    --hover: #f5f4f1;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-font-smoothing: antialiased; }
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
  }
  .mono { font-family: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace; font-variant-numeric: tabular-nums; }

  .wrap { max-width: 1160px; margin: 0 auto; padding: 0 24px; }

  header {
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .header-inner {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 20px 0 16px;
  }
  .wordmark { font-size: 16px; font-weight: 650; letter-spacing: -0.015em; }
  .wordmark small {
    display: block; font-size: 11px; font-weight: 450;
    color: var(--muted); letter-spacing: 0.02em; margin-top: 1px;
  }
  .header-right { display: flex; align-items: center; gap: 20px; }
  .clock { font-size: 12px; color: var(--muted); }
  .live-btn {
    display: flex; align-items: center; gap: 7px;
    background: none; border: 1px solid var(--border-strong);
    border-radius: 6px; padding: 5px 11px;
    font-size: 12px; color: var(--text); cursor: pointer;
    font-family: inherit;
  }
  .live-btn:hover { background: var(--hover); }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .dot.run { background: var(--run); }
  .dot.wait { background: var(--wait); }
  .dot.err { background: var(--err); }
  .dot.done { background: var(--done); }
  .dot.live { background: var(--run); animation: pulse 1.8s infinite; }
  .dot.off { background: var(--faint); animation: none; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(21, 128, 61, .35); }
    70% { box-shadow: 0 0 0 5px rgba(21, 128, 61, 0); }
    100% { box-shadow: 0 0 0 0 rgba(21, 128, 61, 0); }
  }

  .kpis {
    display: flex; flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .kpi { padding: 18px 32px 16px 0; margin-right: 32px; border-right: 1px solid var(--border); min-width: 130px; }
  .kpi:last-child { border-right: none; }
  .kpi .label {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.09em;
    color: var(--muted); font-weight: 550;
  }
  .kpi .value { font-size: 26px; font-weight: 500; margin-top: 2px; }
  .kpi .sub { font-size: 11.5px; color: var(--faint); margin-top: 0; }

  .toolbar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    padding: 14px 0 0;
  }
  .toolbar input[type="search"] {
    background: var(--surface); border: 1px solid var(--border-strong);
    border-radius: 6px; padding: 6px 11px; font-size: 13px;
    color: var(--text); width: 250px; outline: none; font-family: inherit;
  }
  .toolbar input[type="search"]:focus { border-color: var(--text); }
  .toolbar input[type="search"]::placeholder { color: var(--faint); }
  .filters { display: flex; gap: 2px; margin-left: 8px; }
  .filter-btn {
    background: none; border: none; padding: 6px 10px;
    font-size: 12.5px; color: var(--muted); cursor: pointer;
    border-radius: 5px; font-family: inherit;
  }
  .filter-btn:hover { color: var(--text); background: var(--hover); }
  .filter-btn.active { background: var(--text); color: var(--surface); }

  .tabs {
    display: flex; flex-wrap: wrap; gap: 0 26px;
    border-bottom: 1px solid var(--border);
    margin-top: 10px;
  }
  .tab {
    background: none; border: none; cursor: pointer;
    padding: 11px 0 9px; font-size: 13.5px; color: var(--muted);
    border-bottom: 2px solid transparent; margin-bottom: -1px;
    font-family: inherit;
  }
  .tab sup { font-size: 10px; color: var(--faint); margin-left: 3px; }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--text); font-weight: 550; border-bottom-color: var(--text); }
  .tab.active sup { color: var(--muted); }

  section { padding: 22px 0 8px; }
  .sec-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
  .sec-head h2 { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
  .sec-head span { font-size: 12px; color: var(--faint); }

  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }

  .wf-row {
    display: grid;
    grid-template-columns: 108px 1fr 190px 150px 52px;
    gap: 18px; align-items: center;
    padding: 13px 18px;
    cursor: pointer; border-top: 1px solid var(--border);
  }
  .wf-row:first-child { border-top: none; }
  .wf-row:hover { background: var(--hover); }
  .wf-status { display: flex; align-items: center; gap: 7px; font-size: 12px; }
  .wf-name { font-size: 13.5px; font-weight: 550; }
  .wf-sub { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .wf-agents { font-size: 12px; color: var(--muted); }
  .wf-bar { height: 3px; background: #edece8; border-radius: 2px; overflow: hidden; }
  .wf-bar > div { height: 100%; background: var(--text); transition: width .6s ease; }
  .wf-bar > div.warn { background: var(--wait); }
  .wf-bar > div.err { background: var(--err); }
  .wf-pct { text-align: right; font-size: 12.5px; color: var(--muted); }
  @media (max-width: 900px) {
    .wf-row { grid-template-columns: 96px 1fr 90px; }
    .wf-agents, .wf-bar { display: none; }
  }

  .agent-head, .agent-row {
    display: grid;
    grid-template-columns: 200px 170px 1fr 150px 60px;
    gap: 18px; align-items: center;
    padding: 10px 18px;
  }
  .agent-head {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.09em;
    color: var(--faint); font-weight: 550;
    border-bottom: 1px solid var(--border); background: var(--bg);
  }
  .agent-row { border-top: 1px solid var(--border); font-size: 13px; }
  .agent-row:first-of-type { border-top: none; }
  .agent-row:hover { background: var(--hover); }
  .agent-name { font-weight: 550; display: flex; align-items: center; gap: 8px; }
  .agent-dept { font-size: 12.5px; color: var(--muted); }
  .agent-task { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .agent-load { display: flex; align-items: center; gap: 10px; }
  .agent-load .bar { flex: 1; height: 3px; background: #edece8; border-radius: 2px; overflow: hidden; }
  .agent-load .bar > div { height: 100%; background: var(--text); transition: width .6s; }
  .agent-load .bar > div.hi { background: var(--wait); }
  .agent-load .bar > div.err { background: var(--err); }
  .agent-pct { font-size: 12px; color: var(--muted); text-align: right; }
  .agent-status { font-size: 12px; display: flex; align-items: center; gap: 7px; }
  @media (max-width: 900px) {
    .agent-head { display: none; }
    .agent-row { grid-template-columns: 1fr 90px; }
    .agent-dept, .agent-load, .agent-pct { display: none; }
  }

  .empty { padding: 28px 18px; color: var(--muted); font-size: 13px; }

  .overlay {
    position: fixed; inset: 0; background: rgba(26, 26, 24, .42);
    display: none; align-items: flex-start; justify-content: center;
    z-index: 50; padding: 8vh 20px 20px;
  }
  .overlay.open { display: flex; }
  .modal {
    background: var(--surface); border: 1px solid var(--border-strong);
    border-radius: 10px; width: 100%; max-width: 600px;
    max-height: 82vh; overflow-y: auto; padding: 26px 28px;
    box-shadow: 0 12px 40px rgba(26,26,24,.14);
  }
  .modal-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  .modal h3 { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
  .modal .m-sub { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
  .close-btn {
    background: none; border: 1px solid var(--border-strong); border-radius: 6px;
    padding: 4px 10px; font-size: 12px; color: var(--muted); cursor: pointer;
    font-family: inherit; flex-shrink: 0;
  }
  .close-btn:hover { color: var(--text); background: var(--hover); }
  .modal .wf-bar { margin: 18px 0 4px; height: 4px; }
  .m-meta { font-size: 12px; color: var(--faint); margin-bottom: 18px; }
  .steps { border-top: 1px solid var(--border); }
  .step {
    display: flex; gap: 14px; padding: 10px 2px;
    font-size: 13px; border-bottom: 1px solid var(--border);
    align-items: baseline;
  }
  .step .idx { font-size: 11px; color: var(--faint); width: 20px; flex-shrink: 0; }
  .step .mark { width: 16px; text-align: center; flex-shrink: 0; font-size: 11px; }
  .step .s-name { flex: 1; }
  .step.done .s-name { color: var(--muted); }
  .step.active .s-name { font-weight: 600; }
  .step.active .mark { color: var(--run); }
  .m-agents { margin: 18px 0 6px; font-size: 12.5px; color: var(--muted); }
  .log {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 6px; padding: 12px 14px;
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    font-size: 11.5px; color: var(--muted);
    max-height: 150px; overflow-y: auto; margin-top: 14px;
  }
  .log div { padding: 1.5px 0; }
  .log .t { color: var(--faint); }

  footer {
    border-top: 1px solid var(--border);
    margin-top: 26px; padding: 16px 0 30px;
    font-size: 12px; color: var(--faint);
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px;
  }
</style>
</head>
<body>

<header>
  <div class="wrap header-inner">
    <div class="wordmark">Betriebszentrale
      <small>Workflows, Prozesse &amp; Agents im Unternehmen</small>
    </div>
    <div class="header-right">
      <span class="clock mono" id="clock"></span>
      <button class="live-btn" id="liveToggle" title="Live-Aktualisierung an/aus">
        <span class="dot live" id="liveDot"></span><span id="liveLabel">Live</span>
      </button>
    </div>
  </div>
</header>

<div class="kpis"><div class="wrap" style="display:flex;flex-wrap:wrap" id="kpis"></div></div>

<div class="wrap">
  <div class="toolbar">
    <input type="search" id="search" placeholder="Workflows oder Agents suchen">
    <div class="filters" id="statusFilters"></div>
  </div>

  <nav class="tabs" id="deptTabs"></nav>

  <section>
    <div class="sec-head"><h2>Workflows</h2><span id="wfCount"></span></div>
    <div class="panel" id="workflowList"></div>
  </section>

  <section>
    <div class="sec-head"><h2>Agents</h2><span id="agCount"></span></div>
    <div class="panel" id="agentPanel">
      <div class="agent-head">
        <span>Agent</span><span>Bereich</span><span>Aktuelle Aufgabe</span><span>Auslastung</span><span style="text-align:right">Status</span>
      </div>
      <div id="agentList"></div>
    </div>
  </section>

  <footer>
    <span>Betriebszentrale · Prototyp, Daten simuliert</span>
    <span class="mono" id="lastUpdate"></span>
  </footer>
</div>

<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>

<script>
const DEPARTMENTS = [
  { id: "buchhaltung", name: "Buchhaltung" },
  { id: "lohn", name: "Lohnverrechnung" },
  { id: "av", name: "Arbeitsvorbereitung" },
  { id: "waren", name: "Warenwirtschaft" },
  { id: "produktion", name: "Produktion" },
];

let uid = 0;
const W = (dept, name, sub, status, progress, agents, steps) =>
  ({ id: ++uid, dept, name, sub, status, progress, agents, steps });

const WORKFLOWS = [
  W("buchhaltung", "Eingangsrechnungen verbuchen", "OCR + Freigabe-Workflow", "läuft", 62,
    ["Beleg-Bot", "Prüf-Agent"],
    ["Belege einlesen (OCR)", "Positionen prüfen", "Kostenstellen zuordnen", "Freigabe einholen", "In ERP buchen"]),
  W("buchhaltung", "Bankabstimmung, Konto 1800", "Täglicher Abgleich Bank ↔ ERP", "läuft", 84,
    ["Abgleich-Bot"],
    ["Kontoauszug abrufen", "Positionen matchen", "Offene Posten markieren", "Differenzreport erzeugen"]),
  W("buchhaltung", "Monatsabschluss vorbereiten", "Abschluss-Checkliste Februar", "wartet", 30,
    ["Abschluss-Agent"],
    ["Abschreibungen laufen lassen", "Rückstellungen prüfen", "Umsatzsteuer-Vormeldung", "Freigabe durch Steuerberatung"]),
  W("lohn", "Lohnlauf Februar", "Gehälter + Stunden erfassen", "läuft", 71,
    ["Zeiten-Bot", "Lohn-Agent"],
    ["Zeiterfassung importieren", "Überstunden validieren", "Zulagen und Sonderzahlungen", "Lohnjournal erzeugen", "SEPA-Datei erstellen"]),
  W("lohn", "Krankmeldungen verarbeiten", "AU-Meldungen an Krankenkasse", "läuft", 45,
    ["Melde-Bot"],
    ["Bescheinigungen einlesen", "Entgeltfortzahlung berechnen", "Meldung an Krankenkasse", "Ablage Personalakte"]),
  W("lohn", "Finanzamt-Meldungen", "Lohnsteuer + SV-Meldungen", "fehler", 55,
    ["Melde-Bot"],
    ["Daten sammeln", "Prüfregeln ausführen", "Übermittlung DEÜV", "Bestätigung archivieren"]),
  W("av", "Auftrag 2024-1187: CNC-Frästeile", "Arbeitspläne + Materialbedarf", "läuft", 38,
    ["Planungs-Agent", "Stücklisten-Bot"],
    ["Zeichnungen prüfen", "Arbeitsplan erstellen", "Materialbedarf ermitteln", "Maschinenbelegung planen", "Freigabe Produktion"]),
  W("av", "Rüstzeiten optimieren", "Analyse Woche 8", "wartet", 12,
    ["Analyse-Agent"],
    ["Rüstprotokolle sammeln", "Muster erkennen", "Vorschläge erzeugen"]),
  W("av", "Angebot 2024-0342, Sonderanfertigung", "Kalkulation + Vertriebsfreigabe", "läuft", 66,
    ["Kalkulations-Agent"],
    ["Stückliste aus CAD", "Lieferantenpreise abrufen", "Kalkulation erstellen", "Vertriebsfreigabe"]),
  W("waren", "Wareneingang, Lieferant Metzger GmbH", "Lieferschein 88412", "läuft", 90,
    ["WE-Bot"],
    ["Lieferschein scannen", "Mengen prüfen", "Qualitätskontrolle", "ERP-Buchung"]),
  W("waren", "Inventurdifferenzen auflösen", "Lager 1 und 2, 23 Positionen", "fehler", 20,
    ["Inventur-Bot"],
    ["Differenzen ermitteln", "Ursachenanalyse", "Umbuchungen vorbereiten", "Freigabe Lagerleitung"]),
  W("waren", "Bestellvorschläge generieren", "Disposition, automatische Nachbestellung", "läuft", 58,
    ["Dispo-Agent"],
    ["Bestände und Bedarfe lesen", "Mindestmengen prüfen", "Bestellvorschläge erzeugen", "An Einkaufs-Workflow übergeben"]),
  W("produktion", "Schichtplan A: Serienfertigung", "Linie 2, Tagesschicht", "läuft", 77,
    ["Leitstand-Agent", "Qualitäts-Bot"],
    ["Material bereitstellen", "Maschinen aufrüsten", "Fertigung laufen", "Qualitätsprüfung", "Rückmeldung ERP"]),
  W("produktion", "Wartung Presse P-07", "Geplante Wartung Woche 9", "wartet", 5,
    ["Wartungs-Planer"],
    ["Ersatzteile reservieren", "Stillstand einplanen", "Wartungsauftrag erstellen"]),
  W("produktion", "Rückruf: Charge 2024-0291", "Qualitätsproblem erkannt", "fehler", 40,
    ["Rückruf-Agent", "Qualitäts-Bot"],
    ["Betroffene Chargen identifizieren", "Kunden benachrichtigen", "Bestände sperren", "Ursachenanalyse"]),
  W("produktion", "Endkontrolle Auftrag 2024-1179", "Stichprobenprüfung", "fertig", 100,
    ["Qualitäts-Bot"],
    ["Prüfplan laden", "Messwerte erfassen", "Prüfbericht erstellen", "Freigabe Versand"]),
];

const AGENTS = [
  { name: "Beleg-Bot", dept: "buchhaltung", status: "online", load: 72, task: "Verarbeitet Rechnung RE-2024-8841 (OCR)" },
  { name: "Prüf-Agent", dept: "buchhaltung", status: "online", load: 58, task: "Prüft Kostenstellen-Zuordnung" },
  { name: "Abschluss-Agent", dept: "buchhaltung", status: "online", load: 31, task: "Wartet auf Freigabe Monatsabschluss" },
  { name: "Abgleich-Bot", dept: "buchhaltung", status: "online", load: 44, task: "Bankpositionen abgleichen" },
  { name: "Zeiten-Bot", dept: "lohn", status: "online", load: 66, task: "Import Zeiterfassung KW 8" },
  { name: "Lohn-Agent", dept: "lohn", status: "online", load: 81, task: "Lohnjournal Februar erzeugen" },
  { name: "Melde-Bot", dept: "lohn", status: "error", load: 92, task: "Fehler: DEÜV-Übermittlung abgelehnt" },
  { name: "Planungs-Agent", dept: "av", status: "online", load: 77, task: "Arbeitsplan Auftrag 2024-1187" },
  { name: "Stücklisten-Bot", dept: "av", status: "online", load: 49, task: "Stückliste aus CAD extrahieren" },
  { name: "Kalkulations-Agent", dept: "av", status: "online", load: 63, task: "Angebot 2024-0342 kalkulieren" },
  { name: "Analyse-Agent", dept: "av", status: "idle", load: 12, task: "Wartet auf Rüstprotokolle" },
  { name: "WE-Bot", dept: "waren", status: "online", load: 39, task: "Wareneingang Lieferschein 88412" },
  { name: "Inventur-Bot", dept: "waren", status: "error", load: 88, task: "Fehler: Bestandsdaten unvollständig" },
  { name: "Dispo-Agent", dept: "waren", status: "online", load: 55, task: "Bestellvorschläge generieren" },
  { name: "Leitstand-Agent", dept: "produktion", status: "online", load: 84, task: "Schichtplan A steuern" },
  { name: "Qualitäts-Bot", dept: "produktion", status: "online", load: 61, task: "Stichproben Auftrag 2024-1179" },
  { name: "Rückruf-Agent", dept: "produktion", status: "online", load: 70, task: "Charge 2024-0291 sperren" },
  { name: "Wartungs-Planer", dept: "produktion", status: "idle", load: 8, task: "Wartung Presse P-07 vorbereiten" },
];

const STATUS = {
  läuft:  { label: "Läuft",   dot: "run" },
  wartet: { label: "Wartet",  dot: "wait" },
  fehler: { label: "Fehler",  dot: "err" },
  fertig: { label: "Fertig",  dot: "done" },
};
const AGENT_STATUS = {
  online: { label: "Aktiv",   dot: "run" },
  idle:   { label: "Inaktiv", dot: "done" },
  error:  { label: "Fehler",  dot: "err" },
};

let activeDept = "alle";
let activeStatus = "alle";
let searchTerm = "";
let live = true;

const deptTabs = document.getElementById("deptTabs");
const workflowList = document.getElementById("workflowList");
const agentList = document.getElementById("agentList");
const statusFilters = document.getElementById("statusFilters");
const kpis = document.getElementById("kpis");

const deptById = id => DEPARTMENTS.find(d => d.id === id);

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function renderKpis() {
  const count = s => WORKFLOWS.filter(w => w.status === s).length;
  const running = count("läuft"), waiting = count("wartet"),
        errors = count("fehler"), done = count("fertig");
  const online = AGENTS.filter(a => a.status === "online").length;
  const items = [
    ["Aktive Workflows", running, `von ${WORKFLOWS.length} insgesamt`],
    ["Agents aktiv", online, `von ${AGENTS.length} Agents`],
    ["Wartend", waiting, "Freigaben / Material"],
    ["Fehler", errors, "benötigen Eingriff"],
    ["Abgeschlossen", done, "im aktuellen Lauf"],
  ];
  kpis.innerHTML = items.map(([l, v, s]) =>
    `<div class="kpi"><div class="label">${l}</div><div class="value mono">${v}</div><div class="sub">${s}</div></div>`
  ).join("");
}

function renderTabs() {
  const tab = (id, name, count) =>
    `<button class="tab${activeDept === id ? " active" : ""}" data-dept="${id}">${name}<sup>${count}</sup></button>`;
  deptTabs.innerHTML =
    tab("alle", "Alle Bereiche", WORKFLOWS.length)
    + DEPARTMENTS.map(d =>
        tab(d.id, d.name, WORKFLOWS.filter(w => w.dept === d.id).length)
      ).join("");
}

function renderFilters() {
  const btn = (id, label) =>
    `<button class="filter-btn${activeStatus === id ? " active" : ""}" data-status="${id}">${label}</button>`;
  statusFilters.innerHTML =
    btn("alle", "Alle") + Object.keys(STATUS).map(s => btn(s, STATUS[s].label)).join("");
}

function matchesFilters(w) {
  const deptOk = activeDept === "alle" || w.dept === activeDept;
  const statusOk = activeStatus === "alle" || w.status === activeStatus;
  const t = searchTerm.toLowerCase();
  const searchOk = !t || (w.name + " " + w.sub + " " + w.agents.join(" ")).toLowerCase().includes(t);
  return deptOk && statusOk && searchOk;
}

function agentMatches(a) {
  const deptOk = activeDept === "alle" || a.dept === activeDept;
  const t = searchTerm.toLowerCase();
  return deptOk && (!t || (a.name + " " + a.task).toLowerCase().includes(t));
}

function barClass(status) {
  if (status === "fehler") return "err";
  if (status === "wartet") return "warn";
  return "";
}

function renderWorkflows() {
  const list = WORKFLOWS.filter(matchesFilters);
  document.getElementById("wfCount").textContent = `${list.length} von ${WORKFLOWS.length}`;
  if (!list.length) {
    workflowList.innerHTML = `<div class="empty">Keine Workflows für die aktuelle Auswahl.</div>`;
    return;
  }
  workflowList.innerHTML = list.map(w => {
    const d = deptById(w.dept);
    const st = STATUS[w.status];
    return `<div class="wf-row" data-wf="${w.id}" role="button" tabindex="0">
      <div class="wf-status"><span class="dot ${st.dot}"></span>${st.label}</div>
      <div>
        <div class="wf-name">${esc(w.name)}</div>
        <div class="wf-sub">${esc(d.name)} · ${esc(w.sub)}</div>
      </div>
      <div class="wf-agents">${esc(w.agents.join(", "))}</div>
      <div class="wf-bar"><div class="${barClass(w.status)}" style="width:${w.progress}%"></div></div>
      <div class="wf-pct mono">${w.progress}&thinsp;%</div>
    </div>`;
  }).join("");
}

function renderAgents() {
  const list = AGENTS.filter(agentMatches);
  document.getElementById("agCount").textContent = `${list.length} von ${AGENTS.length}`;
  if (!list.length) {
    agentList.innerHTML = `<div class="empty">Keine Agents für die aktuelle Auswahl.</div>`;
    return;
  }
  agentList.innerHTML = list.map(a => {
    const d = deptById(a.dept);
    const st = AGENT_STATUS[a.status];
    const cls = a.status === "error" ? "err" : a.load > 80 ? "hi" : "";
    return `<div class="agent-row">
      <div class="agent-name"><span class="dot ${st.dot}"></span>${esc(a.name)}</div>
      <div class="agent-dept">${esc(d.name)}</div>
      <div class="agent-task">${esc(a.task)}</div>
      <div class="agent-load"><div class="bar"><div class="${cls}" style="width:${a.load}%"></div></div></div>
      <div class="agent-pct mono">${a.load}&thinsp;%</div>
      <div class="agent-status">${st.label}</div>
    </div>`;
  }).join("");
}

function renderAll() { renderKpis(); renderTabs(); renderFilters(); renderWorkflows(); renderAgents(); }

/* Simulation */
const LOG_TEMPLATES = [
  "Beleg {n} erfolgreich verarbeitet",
  "Freigabe durch Supervisor erhalten",
  "Position {n} mit Kostenstelle 4310 verknüpft",
  "Preisänderung erkannt, Neukalkulation gestartet",
  "Bestandsaktualisierung abgeschlossen",
  "Nachricht an ERP-Interface gesendet",
  "Prüfregel R-{n} bestanden",
  "Warte auf Eingabe der Abteilung",
];

function tick() {
  WORKFLOWS.forEach(w => {
    if (w.status === "läuft") {
      w.progress = Math.min(100, w.progress + Math.floor(Math.random() * 3));
      if (w.progress >= 100) w.status = "fertig";
    } else if (w.status === "wartet" && Math.random() < 0.12) {
      w.status = "läuft";
    } else if (w.status === "fehler" && Math.random() < 0.05) {
      w.status = "wartet";
    } else if (w.status === "fertig" && Math.random() < 0.04) {
      w.progress = 0; w.status = "läuft";
    }
  });
  AGENTS.forEach(a => {
    if (a.status === "error" && Math.random() < 0.08) {
      a.status = "online"; a.task = a.task.replace(/^Fehler: /, "Wiederholung: ");
    }
    if (a.status === "online") {
      a.load = Math.max(10, Math.min(98, Math.round(a.load + (Math.random() * 10 - 5))));
      if (Math.random() < 0.05) { a.status = "idle"; a.task = "Wartet auf neuen Auftrag"; }
    } else if (a.status === "idle" && Math.random() < 0.25) {
      a.status = "online";
      a.task = LOG_TEMPLATES[Math.floor(Math.random() * LOG_TEMPLATES.length)]
        .replace("{n}", Math.floor(Math.random() * 90 + 10));
    }
  });
  renderAll();
  document.getElementById("lastUpdate").textContent =
    "Aktualisiert " + new Date().toLocaleTimeString("de-DE");
}

/* Detailansicht */
const overlay = document.getElementById("overlay");
const modal = document.getElementById("modal");
let logTimer = null;

function openWorkflowModal(w) {
  const d = deptById(w.dept);
  const doneCount = Math.round(w.progress / 100 * w.steps.length);
  const state = i => i < doneCount ? "done" : (i === doneCount && w.status !== "fertig" ? "active" : "");
  const mark = { done: "✓", active: "●", "": "○" };
  modal.innerHTML = `
    <div class="modal-head">
      <div>
        <h3>${esc(w.name)}</h3>
        <div class="m-sub">${esc(d.name)} · ${esc(w.sub)}</div>
      </div>
      <button class="close-btn" data-close>Schließen</button>
    </div>
    <div class="wf-bar"><div class="${barClass(w.status)}" style="width:${w.progress}%"></div></div>
    <div class="m-meta">Status: ${STATUS[w.status].label} · Fortschritt ${w.progress}&thinsp;% · ${w.agents.length} Agent${w.agents.length > 1 ? "en" : ""} zugewiesen</div>
    <div class="steps">${w.steps.map((s, i) =>
      `<div class="step ${state(i)}"><span class="idx mono">${String(i + 1).padStart(2, "0")}</span><span class="mark">${mark[state(i)]}</span><span class="s-name">${esc(s)}</span></div>`
    ).join("")}</div>
    <div class="m-agents">Zugewiesene Agents: ${esc(w.agents.join(", "))}</div>
    <div class="log" id="wfLog"></div>`;
  overlay.classList.add("open");
  const log = document.getElementById("wfLog");
  const push = () => {
    const t = new Date().toLocaleTimeString("de-DE");
    const line = LOG_TEMPLATES[Math.floor(Math.random() * LOG_TEMPLATES.length)]
      .replace("{n}", Math.floor(Math.random() * 90 + 10));
    const div = document.createElement("div");
    div.innerHTML = `<span class="t">[${t}]</span> ${esc(w.agents[0])}: ${esc(line)}`;
    log.prepend(div);
    while (log.children.length > 30) log.lastChild.remove();
  };
  push(); push(); push();
  logTimer = setInterval(push, 2500);
}

function closeModal() {
  overlay.classList.remove("open");
  if (logTimer) { clearInterval(logTimer); logTimer = null; }
}

overlay.addEventListener("click", e => {
  if (e.target === overlay || e.target.closest("[data-close]")) closeModal();
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

/* Ereignisse */
deptTabs.addEventListener("click", e => {
  const tab = e.target.closest(".tab");
  if (!tab) return;
  activeDept = tab.dataset.dept;
  renderAll();
});
statusFilters.addEventListener("click", e => {
  const btn = e.target.closest(".filter-btn");
  if (!btn) return;
  activeStatus = btn.dataset.status;
  renderFilters(); renderWorkflows();
});
document.getElementById("search").addEventListener("input", e => {
  searchTerm = e.target.value.trim();
  renderAll();
});
workflowList.addEventListener("click", e => {
  const row = e.target.closest(".wf-row");
  if (!row) return;
  const w = WORKFLOWS.find(x => x.id === Number(row.dataset.wf));
  if (w) openWorkflowModal(w);
});
workflowList.addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  const row = e.target.closest(".wf-row");
  if (!row) return;
  const w = WORKFLOWS.find(x => x.id === Number(row.dataset.wf));
  if (w) openWorkflowModal(w);
});
const liveToggle = document.getElementById("liveToggle");
liveToggle.addEventListener("click", () => {
  live = !live;
  document.getElementById("liveDot").className = "dot " + (live ? "live" : "off");
  document.getElementById("liveLabel").textContent = live ? "Live" : "Angehalten";
});

setInterval(() => {
  document.getElementById("clock").textContent =
    new Date().toLocaleString("de-DE", { weekday: "short", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit" });
}, 1000);
setInterval(() => { if (live) tick(); }, 3000);

renderAll();
</script>
</body>
</html>
